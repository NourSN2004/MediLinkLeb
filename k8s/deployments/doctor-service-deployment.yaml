apiVersion: apps/v1
kind: Deployment
metadata:
  name: doctor-service
  namespace: medilink
  labels:
    app: doctor-service
    tier: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: doctor-service
  template:
    metadata:
      labels:
        app: doctor-service
        tier: backend
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - doctor-service
              topologyKey: kubernetes.io/hostname
      containers:
      - name: doctor-service
        image: doctor-service:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8002
          name: http
        envFrom:
        - configMapRef:
            name: app-config
        - secretRef:
            name: db-secrets
        - secretRef:
            name: app-secrets
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health/live/
            port: 8002
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health/ready/
            port: 8002
          initialDelaySeconds: 20
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
