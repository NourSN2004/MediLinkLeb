apiVersion: apps/v1
kind: Deployment
metadata:
  name: jenkins
  namespace: jenkins
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jenkins
  template:
    metadata:
      labels:
        app: jenkins
    spec:
      serviceAccountName: jenkins
      securityContext:
        fsGroup: 1000
        supplementalGroups: [999]  # Docker group
        runAsUser: 1000
      initContainers:
      - name: volume-permissions
        image: busybox
        command: ['sh', '-c', 'chown -R 1000:1000 /var/jenkins_home']
        volumeMounts:
        - name: jenkins-home
          mountPath: /var/jenkins_home
        securityContext:
          runAsUser: 0
      - name: install-docker
        image: docker:dind
        command: ['sh', '-c', 'cp /usr/local/bin/docker /usr/local/bin/docker-tmp/']
        volumeMounts:
        - name: docker-bin
          mountPath: /usr/local/bin/docker-tmp
        securityContext:
          runAsUser: 0
      - name: install-kubectl
        image: bitnami/kubectl:latest
        command: ['sh', '-c', 'cp /opt/bitnami/kubectl/bin/kubectl /usr/local/bin/kubectl-tmp/']
        volumeMounts:
        - name: kubectl-bin
          mountPath: /usr/local/bin/kubectl-tmp
        securityContext:
          runAsUser: 0
      containers:
      - name: jenkins
        image: jenkins/jenkins:lts-jdk17
        ports:
        - containerPort: 8080
          name: http
        - containerPort: 50000
          name: agent
        env:
        - name: JAVA_OPTS
          value: "-Xmx512m"
        volumeMounts:
        - name: jenkins-home
          mountPath: /var/jenkins_home
        - name: docker-sock
          mountPath: /var/run/docker.sock
        - name: docker-bin
          mountPath: /usr/local/bin/docker
          subPath: docker
        - name: kubectl-bin
          mountPath: /usr/local/bin/kubectl
          subPath: kubectl
        resources:
          requests:
            memory: "640Mi"
            cpu: "250m"
          limits:
            memory: "640Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /login
            port: 8080
          initialDelaySeconds: 90
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 5
        readinessProbe:
          httpGet:
            path: /login
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
      volumes:
      - name: jenkins-home
        persistentVolumeClaim:
          claimName: jenkins-pvc
      - name: docker-sock
        hostPath:
          path: /var/run/docker.sock
      - name: docker-bin
        emptyDir: {}
      - name: kubectl-bin
        emptyDir: {}
